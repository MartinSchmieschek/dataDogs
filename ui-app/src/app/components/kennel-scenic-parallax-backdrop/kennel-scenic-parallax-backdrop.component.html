  <div class="scenic-layer scenic-layer--forest-mid" [ngStyle]="layerParallax(0.17, 0.38)">

      <svg class="scenic-svg scenic-svg--forest-mid" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">

  <div class="scenic-layer scenic-layer--forest-air" [ngStyle]="layerParallax(0.13, 0.28)"></div>

  <div class="scenic-layer scenic-layer--hill" [ngStyle]="layerParallax(0.26, 0.55)">
    <div class="scenic-overscan scenic-overscan--hill">
      <svg class="scenic-svg scenic-svg--hill" viewBox="-700 0 3000 420" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">

  <div class="scenic-layer scenic-layer--hero" [ngStyle]="layerParallax(0.44, 0.95)">
